<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>フレーズプレイヤー</title><link rel="stylesheet" href="style.css"><script defer src="common.js"></script><script defer src="player.js"></script></head>
<body>
<main>
  <section id="loader" class="welcome">
    <p class="eyebrow">VOCAL PRACTICE</p><h1>フレーズプレイヤー</h1><p class="intro">歌詞をタップして、<br>練習したいフレーズから。</p>
    <div class="card"><label>音源ファイル <span>WAV / MP3</span><input id="audio-file" type="file" accept=".wav,.mp3,audio/wav,audio/mpeg"></label><p id="audio-status" role="status">音源を選択してください</p></div>
    <div class="card"><label>曲データ <span>JSON</span><input id="json-file" type="file" accept=".json,application/json"></label><p id="json-status" role="status">曲データを選択してください</p></div>
    <p class="note">どちらから選んでも構いません。2つの読み込みが完了すると歌詞が表示されます。ファイルは端末内で処理され、送信されません。</p>
  </section>
  <section id="player" hidden>
    <header class="controller">
      <div class="title-row"><div><p class="eyebrow">PHRASE PLAYER</p><h1 id="title"></h1><p id="artist"></p></div><button id="change" class="secondary">曲を変更</button></div>
      <div class="time"><output id="current">0:00</output><span id="duration">0:00</span></div><input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="再生位置">
      <div class="transport"><button id="previous" class="secondary">前のフレーズ</button><button id="play">再生</button><button id="next" class="secondary">次のフレーズ</button></div>
      <fieldset class="modes"><legend>再生モード</legend><label><input type="radio" name="mode" value="continuous" checked>連続再生</label><label><input type="radio" name="mode" value="segment">区間再生</label></fieldset>
      <p class="hint">歌詞をタップして再生。同じ歌詞で、もう一度。</p>
    </header>
    <div id="lyrics" class="lyrics"></div>
  </section>
  <p id="error" class="error" role="alert" hidden></p>
</main><audio id="audio" preload="auto"></audio>
</body></html>
